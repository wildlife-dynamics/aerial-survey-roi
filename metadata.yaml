description: Generates aerial survey transect lines across a user-uploaded region of interest (ROI) boundary, at a specified direction and spacing, and displays them on an interactive dashboard map.

# todo: add example
theory: "Transect lines are generated across the ROI at a user-specified compass direction and spacing, then clipped to the ROI boundary, following the systematic transect design common to aerial wildlife survey flight planning." # optional

# todo: add example
output_comment: "Outputs the generated survey transects as GeoParquet file, plus an interactive HTML ecomap showing the ROI boundary and survey lines, all bundled into a dashboard widget." # optional

